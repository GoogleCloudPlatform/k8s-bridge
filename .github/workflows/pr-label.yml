name: PR Release Label

on:
  pull_request:
    types:
      - opened
      - labeled
      - unlabeled
      - synchronize
      - reopened

permissions: {}

jobs:
  check-label:
    permissions: {}
    name: Verify Release Changelog Label
    runs-on: ubuntu-latest
    steps:
      - name: Check for required release changelog label
        run: |
          MATCHED=$(jq -r '
            [.pull_request.labels[]?.name
              | select(. == (
                  "release-breaking",
                  "release-features",
                  "release-improvements",
                  "release-bugfix",
                  "skip-changelog",
                  "dependencies"
                ))
            ] | join(", ")
          ' "$GITHUB_EVENT_PATH")
          if [ -z "$MATCHED" ]; then
            echo "::error::Pull request must have at least one release changelog label: release-breaking, release-features, release-improvements, release-bugfix, skip-changelog, or dependencies."
            exit 1
          fi
          echo "Found release changelog label(s): $MATCHED"
