name: E2E Tests

on:
  push:
    branches:
      - main
      - 'release-*'
  pull_request:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Cache third-party Docker images
        id: cache-third-party-images
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/docker-cache
          key: e2e-third-party-images-${{ runner.os }}-${{ hashFiles('test/e2e/testdata/third_party/**', 'test/utils/utils.go') }}

      - name: Load cached third-party Docker images
        if: steps.cache-third-party-images.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/docker-cache/third-party.tar
          rm -f /tmp/docker-cache/third-party.tar

      - name: Running Test e2e
        run: make test-e2e

      - name: Save third-party Docker images to cache
        if: steps.cache-third-party-images.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker-cache
          IMAGES=$( (echo "curlimages/curl:8.16.0"; grep -hEo 'image:[[:space:]]*["'\'']?[^"'\''[:space:]@]+["'\'']?' test/e2e/testdata/third_party/*.yaml | sed -E 's/^image:[[:space:]]*["'\'']?([^"'\''[:space:]]+)["'\'']?$/\1/') | sort -u )
          docker save -o /tmp/docker-cache/third-party.tar ${IMAGES}
