---
# 1. Define the ResourceFlavor to target the specific GKE nodes
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: e2-medium-default-pool
spec:
  nodeLabels:
    # GKE standard labels to target the specific nodepool and machine type
    cloud.google.com/gke-nodepool: default-pool
    node.kubernetes.io/instance-type: e2-medium

---
# 2. Define the ClusterQueue named "test"
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: test
spec:
  namespaceSelector: {} # Empty selector means this ClusterQueue is available to all namespaces
  resourceGroups:
  - coveredResources: ["cpu", "memory"]
    flavors:
    - name: e2-medium-default-pool
      resources:
      - name: "cpu"
        nominalQuota: 5     # Safe allocatable CPU for 3x e2-medium nodes
      - name: "memory"
        nominalQuota: 8Gi   # Safe allocatable memory for 3x e2-medium nodes

---
# 3. Define a LocalQueue in your working namespace
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  namespace: default # Change this to the namespace where your jobs will run
  name: test-local-queue
spec:
  clusterQueue: test