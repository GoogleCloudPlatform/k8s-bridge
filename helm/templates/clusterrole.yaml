{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-bridge.fullname" . }}-manager-role
  labels:
    app.kubernetes.io/component: rbac
    {{- include "k8s-bridge.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - jobset.x-k8s.io
  resources:
  - jobsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - jobset.x-k8s.io
  resources:
  - jobsets/finalizers
  verbs:
  - update
- apiGroups:
  - k8s-bridge.x-k8s.io
  resources:
  - workloadmixings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - k8s-bridge.x-k8s.io
  resources:
  - workloadmixings/finalizers
  verbs:
  - update
- apiGroups:
  - k8s-bridge.x-k8s.io
  resources:
  - workloadmixings/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - slinky.slurm.net
  resources:
  - controllers
  - restapis
  verbs:
  - get
  - list
  - watch
{{- end }}
