# The CPU and memory limits of the slurmd container are the maximum node size
# of workloadmixing-partition. k8s-bridge cancels a job that needs more CPUs or
# memory per node. The shared template in workloadmixing_template.yaml keeps no
# limits, so the other tests are not affected.
apiVersion: k8s-bridge.x-k8s.io/v1alpha1
kind: WorkloadMixing
metadata:
  name: workloadmixing-max-node-size
  namespace: slurm
spec:
  controllerRef:
    name: slurm
  partitionsMapping:
    - partition: workloadmixing-partition
      localQueue: test-local-queue
      dynamicNodeFeature: dynamic_kpartition
  podTemplate:
    spec:
      containers:
        - name: slurmd
          # LINT.IfChange(slurm_version_pair)
          image: ghcr.io/slinkyproject/slurmd:26.05-ubuntu24.04
          # LINT.ThenChange(test/utils/slurm.go:slurm_version_pair)
          securityContext:
            privileged: true
          resources:
            limits:
              cpu: "4"
              memory: 8Gi
