# test/e2e/testdata/slurm_cluster_persistent.yaml is a copy of this file with slurmctld
# persistence enabled. When you change this file, change the copy too.
apiVersion: v1
kind: Secret
metadata:
  name: slurm-auth-jwt
  namespace: slurm
type: Opaque
data:
  # Base64 encoded string: "thisisjwtkeyatleast32byteslong12345"
  jwt.key: dGhpc2lzand0a2V5YXRsZWFzdDMyYnl0ZXNsb25nMTIzNDU=
---
apiVersion: v1
kind: Secret
metadata:
  name: slurm-auth-slurm
  namespace: slurm
type: Opaque
data:
  # Base64 encoded string: "thisismungekeyatleast32byteslong123"
  slurm.key: dGhpc2lzbXVuZ2VrZXlhdGxlYXN0MzJieXRlc2xvbmcxMjM=
---
apiVersion: slinky.slurm.net/v1beta1
kind: Controller
metadata:
  name: slurm
  namespace: slurm
spec:
  extraConf: |
    GresTypes=gpu
    EnforcePartLimits=NO
    SchedulerParameters=ignore_constraint_validation
    NodeSet=kdyn_nodes Feature=dynamic_kpartition
    PartitionName=workloadmixing-partition Nodes=kdyn_nodes
    PartitionName=workloadmixing-debug-partition Nodes=kdyn_nodes
    PartitionName=workloadmixing-other-partition Nodes=kdyn_nodes
    PartitionName=workloadmixing-other-partition-2 Nodes=kdyn_nodes
    JobSubmitPlugins=job_submit/lua
    CliFilterPlugins=cli_filter/lua
    CliFilterParameters=workload_mixing_partitions=workloadmixing-partition,workloadmixing-debug-partition
  configFileRefs:
    - name: slurm-job-submit-lua
    - name: slurm-cli-filter-lua
  clusterName: slurm
  persistence:
    enabled: false
  jwtKeyRef:
    name: slurm-auth-jwt
    key: jwt.key
  slurmKeyRef:
    name: slurm-auth-slurm
    key: slurm.key
  # LINT.IfChange(slurm_version_pair)
  slurmctld:
    image: ghcr.io/slinkyproject/slurmctld:26.05-ubuntu24.04
    env:
      - name: WORKLOAD_MIXING_PARTITIONS
        value: "workloadmixing-partition,workloadmixing-debug-partition"
  reconfigure:
    image: ghcr.io/slinkyproject/slurmctld:26.05-ubuntu24.04
  logfile:
    image: ghcr.io/slinkyproject/slurmctld:26.05-ubuntu24.04
---
apiVersion: slinky.slurm.net/v1beta1
kind: RestApi
metadata:
  name: slurm
  namespace: slurm
spec:
  controllerRef:
    name: slurm
  slurmrestd:
    image: ghcr.io/slinkyproject/slurmrestd:26.05-ubuntu24.04
  # LINT.ThenChange(test/utils/slurm.go:slurm_version_pair)
