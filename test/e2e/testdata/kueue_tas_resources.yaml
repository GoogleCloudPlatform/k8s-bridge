# Kueue TAS resources for the TAS e2e tests. kubernetes.io/hostname is already on every Kind node.
apiVersion: kueue.x-k8s.io/v1beta2
kind: Topology
metadata:
  name: hostname-topology
spec:
  levels:
  - nodeLabel: kubernetes.io/hostname
---
# A TAS ResourceFlavor needs a node label; kubernetes.io/os=linux matches every Kind node.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: tas-flavor
spec:
  nodeLabels:
    kubernetes.io/os: linux
  topologyName: hostname-topology
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: tas-cluster-queue
spec:
  namespaceSelector: {}
  resourceGroups:
  - coveredResources: ["cpu", "memory"]
    flavors:
    - name: tas-flavor
      resources:
      - name: "cpu"
        nominalQuota: 1000
      - name: "memory"
        nominalQuota: 1000Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: tas-local-queue
  namespace: slurm
spec:
  clusterQueue: tas-cluster-queue
